name: CI local-demo
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Repository integrity
        run: python scripts/check_repo.py
      - name: Tests
        run: python -m pytest -q
      - name: Ruff critical syntax and undefined symbols
        run: python -m ruff check backend scripts --select E4,E7,E9,F
# Flutter CI intentionally follows T001 after platform scaffolding + toolchain verification.
